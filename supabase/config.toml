# Aurora Wave 0 — Supabase project config (pg_cron + Edge Functions)
#
# REFERENCE: applied to the live Supabase project via:
#   supabase db push            # apply supabase/migrations/*.sql
#   supabase functions deploy   # deploy the fn-* stubs (wave 0 = skeletons)
#   supabase cron               # register the entries below on the live project
#
# Intervals are NOT frozen by the architecture docs (wave-0 data, OQ-03) —
# values below are ASSUMPTIONS, commented per the wave-0 decision:
#   "-- ASSUMPTION wave-0: <what + why>"
# Final values to be ratified by Foundation.

[pg_cron]
# -- ASSUMPTION wave-0: fsrs-tick runs DAILY at 06:00 UTC. Batch-recomputes
#    due/stability/difficulty for all flashcards (01 §5.1 fn-fsrs-tick).
#    Interval choice: daily keeps the review queue fresh without hot
#    recomputation; adjust per OQ-03.
fsrs-tick-daily = "0 6 * * *"

# -- ASSUMPTION wave-0: event_dispatch every 15 minutes. The dispatcher
#    drains due jobs (fn-job-dispatcher contract, 01 §5.2). A Postgres
#    NOTIFY trigger (0010) also wakes it; the cron is the safety-net poll.
event-dispatch = "*/15 * * * *"

# -- ASSUMPTION wave-0: recompute skill_states every 6 hours.
#    progress_evidences feed skill_states; a periodic job keeps the
#    mirror (03 §4.2 skill_states) fresh between event-driven updates.
skill-states-recompute = "0 */6 * * *"

# -- ASSUMPTION wave-0: recompute progress_evidences daily at 04:00 UTC
#    (batch over the day's TaskCompleted / FlashcardReviewed events).
progress-evidences-recompute = "0 4 * * *"

# --- BARRIERE PROPRE : le JWT est remplace par le secret interne -----------
[functions.fn-dev-auth]
# DEV-ONLY (jamais en prod). verify_jwt = false est SANS DANGER parce que la
# fonction est fail-closed sur DEUX gates independants, dans cet ordre :
#   1. DEV_AUTH_ENABLED doit valoir exactement "true"   -> sinon 404
#   2. x-aurora-internal doit egaler INTERNAL_FN_SECRET -> sinon 401
#      (comparaison a temps constant, cf. secretMatches() ; secret absent =
#      toujours faux, donc pas de porte ouverte si la variable manque)
# Un JWT ne peut pas etre exige ici : l'appelant est le script de provisionnement
# des comptes de dev, qui n'a par construction aucune session utilisateur.
# CORS : allowlist explicite (DEV_AUTH_ALLOWED_ORIGIN), jamais "*".
verify_jwt = false

# --- JWT UTILISATEUR OBLIGATOIRE ------------------------------------------
[functions.fn-agent-run]
# {intent, contextRefs[], taskProfile} -> 202 {ok, data:{jobId}}
verify_jwt = true

[functions.fn-canvas]
# Commandes canvas.read / canvas.write / canvas.comment emises par le kernel
# (single-writer AD-7). L'identite vient du JWT utilisateur (AD-3).
verify_jwt = true

[functions.fn-import-course]
# {courseId, fileRefs[]} -> 202 {jobId}
verify_jwt = true

[functions.fn-integrations]
# OAuth + tick des integrations. Deux appelants : l'app (JWT utilisateur) et
# le tick cron (service_role, qui est un JWT valide) -> true couvre les deux.
verify_jwt = true

[functions.fn-skills]
# Lit les skill_states de l'utilisateur. Identite depuis le Bearer, jamais
# depuis le corps de la requete.
verify_jwt = true

# --- APPELANTS SYSTEME (cron / triggers) ----------------------------------
[functions.fn-job-dispatcher]
# L'UNIQUE dispatcher (01 §5.2). Appele par pg_cron/pg_net et par le trigger
# NOTIFY (migration 0010) : ces appelants presentent la service_role key, qui
# EST un JWT -> verify_jwt = true reste tenable et garde la fonction fermee.
verify_jwt = true

[functions.fn-notifications]
# Declenche par evenement -> OneSignal (quiet-hours aware). Meme raisonnement :
# l'appelant est le dispatcher (service_role), donc un JWT.
verify_jwt = true
