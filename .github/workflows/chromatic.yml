# Aurora — Chromatic (visual regression + publication Storybook)
#
# Publishes Storybook to Chromatic on every push to main (and PRs).
# Works with the pnpm monorepo layout: Storybook lives in packages/ui,
# the root `package.json` exposes a `build-storybook` script
# (`pnpm --filter @aurora/ui build-storybook`), and `chromatic.config.js`
# points to `packages/ui/storybook-static` as the output dir.
#
# Prérequis (1 fois, dans GitHub → Settings → Secrets and variables → Actions) :
#   - CHROMATIC_PROJECT_TOKEN : votre project token
#     (chromatic.com → votre project → Manage → Configure)
#
# Le script racine `build-storybook` (package.json) et
# `chromatic.config.js` (storybookBuildDir: packages/ui/storybook-static)
# font que Chromatic tourne depuis la racine sans qu'il faille changer
# de working directory.

name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: false # on laisse un build Chromatic en cours finir
  # (annuler le builder Storybook au milieu = snapshot corrompu)

env:
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # fetch-depth: 0 → Chromatic/TurboSnap détecte correctement le
        # dernier build ancêtre (baseline).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Chromatic
        # chromaui/action : installe le CLI Chromatic et le lance.
        # Il détecte le script `build-storybook` du package.json racine
        # (ajouté pour le monorepo) et `chromatic.config.js`
        # (storybookBuildDir: packages/ui/storybook-static).
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Monorepo : le site Storybook est public via GitHub Pages
          # (URL repo : /aurora/), pas le preview ephemeral Chromatic.
          # On garde autoAcceptChanges sur main pour que la baseline
          # reste propre (recommandé par Chromatic pour squash merge).
          autoAcceptChanges: main
