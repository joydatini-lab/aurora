# Aurora — CI pipeline (wave 0, AD-16c, owner CI = Foundation)
#
# Refs:
#   - SPEC.md "Plan de Contract Packs wave 0" (gate de boundaries, AD-16c)
#   - docs/architecture/multi-agent-workflow.md S5 (checklist revue commit)
#   - docs/architecture/dependency-matrix.md S10/S15 (anti-patterns rejects en CI)
#
# Regles wave 0 :
#   - push  = install + typecheck + lint + 4 boundary greps
#   - main  = + tests + build + spine test + RLS / view-join static checks
#   - Les scripts check-* n'echouent PAS tant que le workspace n'existe pas
#     (steps continue-on-error + log explicite, "skip with reason", pas FAIL
#     bloquant) — le CI doit tourner des que ci.yml existe.
#   RETIRE le 2026-10-24 (Phase 0, lot P0-A) : les 22 gardes `continue-on-error`
#   sont supprimees — les 19 packages existent, le gate est vert, la CI doit
#   desormais BLOQUER sur un echec. Cf. docs/ci/gate.md §4.5.
#
# Branch protection main (reglage GitHub, PAS automatise par ce fichier —
# documente dans docs/ci/gate.md et .github/BRANCH-PROTECTION.md) :
#   - CI green requis, 1 review requis, force-push interdit.

name: CI

on:
  push:
    branches: [main, "wave0/**", "wave*/**", "rebaseline/**"]
  pull_request:
    branches: [main]
  # Le depot est un FORK : les evenements `push` n'y declenchent pas le CI de
  # facon fiable (0 run sur 2 pushes, alors qu'Actions est actif et qu'un
  # dispatch explicite cree bien un run). Le dispatch manuel garantit qu'on
  # peut lancer le gate a la demande sur n'importe quelle ref.
  workflow_dispatch:

# Concurrency : 1 run de travail par ref — un nouveau push sur la meme ref
# remplace l'ancien (in-progress sur main est annule pour eviter la file).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

# Secrets (cf docs/architecture/secrets-checklist.md) : les donnees
# d'environnement (Supabase / PowerSync / CF / Sentry / PostHog) vivent en
# GitHub Secrets, jamais en clair. Le CI de base n'en consomme aucun
# (typecheck/lint/grep sont statiques) ; le bloc ci-gate ne sera branche
# sur les secrets que wave 1+ (tests live Supabase), marquee ci-gate-todo.
env:
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "24"  # engines: node >=22 ; le depot tourne en 24 (cf docs/ci/gate.md)

jobs:
  # ------------------------------------------------------------------
  # 1. CI de base — chaque push
  # ------------------------------------------------------------------
  ci-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # Le workspace ne contient QUE pnpm-workspace.yaml a ce stade de
        # wave 0 (aucun packages/ ni apps/) — pnpm install doit rester
        # idempotent et rapide.
        run: pnpm install

      - name: Typecheck (tsc --noEmit)
        # Skip with reason tant que le workspace n'existe pas.
        if: ${{ hashFiles('tsconfig.json', 'packages/*/tsconfig.json') != '' }}
        run: pnpm -r typecheck

      - name: Lint (eslint)
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm -r lint

      # ---- 4 boundary greps (SPEC "gate de boundaries", AD-1/AD-2/AD-3) ----
      # Scripts livres dans le commit "wave0/hermes: 4 boundary grep tests"
      # (a suivre). Idempotents, exit 0 clean / exit 1 + ligne en echec.
      - name: "Boundary G1: vendor names hors adapters"
        if: ${{ hashFiles('scripts/check-boundaries.sh') != '' }}
        run: sh scripts/check-boundaries.sh G1

      - name: "Boundary G2: secrets in code"
        if: ${{ hashFiles('scripts/check-boundaries.sh') != '' }}
        run: sh scripts/check-boundaries.sh G2

      - name: "Boundary G3: hardcoded user"
        if: ${{ hashFiles('scripts/check-boundaries.sh') != '' }}
        run: sh scripts/check-boundaries.sh G3

      - name: "Boundary G4: DOM access in agent"
        if: ${{ hashFiles('scripts/check-boundaries.sh') != '' }}
        run: sh scripts/check-boundaries.sh G4

  # ------------------------------------------------------------------
  # 2. Gate main-only — main buildable (SPEC "main buildable apres
  #    chaque vague")
  # ------------------------------------------------------------------
  ci-gate:
    # Sur main (et son push, son PR vers main) le gate complet doit PASS.
    # Sur les autres refs on ne le declenche pas : ce sont les PR qui
    # fusionnent sur main qui le declenchent (jobs on: pull_request).
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ci-base]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        if: ${{ hashFiles('tsconfig.json') != '' }}
        run: pnpm -r typecheck

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm -r lint

      - name: Tests
        # Le runner reel du depot est `pnpm -r test` (chaque package declare le
        # sien : vitest pour packages/ui, `node --experimental-strip-types
        # --test` pour les autres). L'ancienne garde `hashFiles('vitest.config.ts')`
        # etait toujours FAUSSE (ce fichier n'existe pas a la racine) : les 661
        # tests ne tournaient donc JAMAIS en CI.
        if: ${{ hashFiles('packages/domain/package.json') != '' }}
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # ---- Static RLS + no cross-join (commit "wave0/hermes: spine test +
      #      RLS + no cross-join", a suivre) ----
      # Scan supabase/migrations/*.sql + vues PowerSync (packages/data).
      - name: "Spine test: 2 equipes, 1 contrat (packages/domain)"
        # tests/spine/equipe-a.contract.ts et equipe-b.contract.ts produisent
        # le meme contrat (type-check croise, pas de re-declaration — AD-15,
        # spine "test du spine"). Execution via type-stripping natif de Node
        # 22.20+ (zero dep : vitest n'existe pas dans le workspace wave 0,
        # les imports relatifs ".ts" sont resolus par la stripping, les
        # type imports sont supprimes au chargement). Le test runtime
        # execute par vitest arrive en wave 1 avec le runner.
        # Skip with reason tant que packages/domain n'existe pas.
        if: ${{ hashFiles('tests/spine/spine.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings tests/spine/spine.test.ts

      - name: "RLS penetration (static, 01 S2.2 / S7)"
        if: ${{ hashFiles('scripts/check-rls.sh') != '' }}
        run: sh scripts/check-rls.sh
        # Ce gate est STATIQUE (il lit les migrations). La preuve live
        # d'isolation (user A ne lit pas user B, sur CHAQUE table) est
        # scripts/rls-live-check.sh — reproductible SANS credential, via
        # Docker + supabase/postgres. Non branchee en CI pour l'instant :
        # elle demande un runner avec Docker (~2 min de pull d'image).

      - name: "EF imports resolve (supabase/functions not in any tsconfig)"
        # supabase/functions/** is in NO tsconfig, so typecheck never reads it.
        # That hole hid a real defect: fn-job-dispatcher imported two symbols
        # that do not exist, so the EF could not boot, was never deployed, and
        # 34 cron jobs sat pending for 16 days.
        if: ${{ hashFiles('scripts/check-ef-imports.mjs') != '' }}
        run: node scripts/check-ef-imports.mjs

      - name: "EF bundles deployable (workspace imports inlined)"
        # check-ef-imports proves the symbols resolve in the repo; this proves
        # the FUNCTION CAN SHIP self-contained. Measured live 2026-10-24: 5 EFs
        # ACTIVE (0 workspace imports each) and 3 missing — fn-canvas (0),
        # fn-integrations (2), fn-job-dispatcher (10). Deployment stopped
        # (CI deploy is `if: false` pending OQ-03); fn-canvas is the
        # counterexample showing workspace imports are not the sole cause.
        # Rebuilds from source (a stale dist/ cannot satisfy it) and asserts no
        # workspace path, no CJS require(), no bare specifier in the output.
        if: ${{ hashFiles('scripts/check-ef-bundles.mjs') != '' }}
        run: node scripts/check-ef-bundles.mjs

      - name: "No cross-module JOIN (03 S5.4 / F-03)"
        if: ${{ hashFiles('scripts/check-view-joins.ts') != '' }}
        # Node 22.20+ : --experimental-strip-types (run TS natif, zero dep).
        # Pas de pnpm tsx (tsx n'est pas encore une dep du workspace wave 0).
        run: node --experimental-strip-types scripts/check-view-joins.ts

      - name: "Job routing coverage (every JobKind has a handler)"
        # check-ef-imports proves the dispatcher's imports RESOLVE; this proves
        # the handlers they resolve to actually COVER the vocabulary. The two
        # are different failures: PROGRESS_JOB_HANDLERS was a live, resolvable
        # import of an EMPTY ARRAY, so 17 skill_recompute jobs were skipped
        # silently for 16 days. Also guards the first-wins shadowing trap
        # (a no-op table spread before its REST-wired counterpart).
        if: ${{ hashFiles('tests/jobs/routing-coverage.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings tests/jobs/routing-coverage.test.ts

      - name: "Live-only DB objects are versioned (no un-versioned catalog)"
        # The live database carried 3 functions the repo never versioned; a
        # `db reset` would have erased them in silence and broken every signup.
        # The static RLS scan reads migrations, so it cannot miss what is
        # ABSENT — this compares the invariant instead.
        if: ${{ hashFiles('tests/db/live-only-functions.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings tests/db/live-only-functions.test.ts

      - name: Boundary greps (G1-G4)
        run: sh scripts/check-boundaries.sh

      - name: "Node-native tests (E2E gate: OQ-08 device + Focus DPC S13)"
        # Wave 7 ERYNIS : the OQ-08 device gate (testing/matrix S1) + the
        # 8-scenario Focus DPC bundle (docs/focus-mode/spec S13, OQ-17)
        # run as a zero-dep node native test (type-stripping, no
        # Playwright import) — the same shape the device-observed
        # Playwright suite (e2e/device/e2e-device.spec.ts) asserts
        # against the real harness at release time.
        if: ${{ hashFiles('apps/mobile/test/e2e-device.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings --test apps/mobile/test/e2e-device.test.ts apps/mobile/test/focus-dpc.test.ts

      - name: "Perf gate (30fps / TTI / JS budget, 02 S9.1)"
        # Wave 5 ERYNIS : the static perf budgets (apps/mobile/src/perf)
        # run against the frozen 02 S9.1 SLOs (300 Ko gz / 1.5 s TTI /
        # 30 fps). Device-observed via Sentry at release (OQ-08).
        if: ${{ hashFiles('apps/mobile/test/perf-budget.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings --test apps/mobile/test/perf-budget.test.ts

      - name: "Product modes + command palette (feature-registry S7/S4)"
        # Wave 5 ERYNIS : 6 product modes + the capability-registry
        # command palette (feature-registry.md S4/S7) — the UI-shell
        # SSoT for the 5 entry points (UI / palette / agent / deep link /
        # automation all resolve to the same capability).
        if: ${{ hashFiles('apps/mobile/test/product-modes.test.ts') != '' }}
        run: node --experimental-strip-types --no-warnings --test apps/mobile/test/product-modes.test.ts

      # ---- Lot déploiement 2026-10-14 (plan A3, guard de dérive) ----
      # Le SSoT SYNC_STREAMS (packages/data) + les 2 boot sites
      # (apps/mobile boot-data.ts + apps/desktop renderer.jsx) couvrent
      # tous les 11 streams du sync-config.yaml (le registry du lot B
      # story A3) — le CI passe pas si un stream est ajouté au
      # sync-config.yaml sans mise à jour du device boot (AD-7).
      - name: "Sync-config wiring (le SSoT des 11 streams, AD-15/F-03)"
        if: ${{ hashFiles('apps/mobile/test/sync-config-wiring.test.ts') != '' }}
        run: |
          cd apps/mobile
          node --experimental-strip-types --no-warnings \
            --import ./test/register-resolve-hook.mjs \
            --test test/sync-config-wiring.test.ts

      - name: "R2 storage adapter (le presign SigV4, AD-16, lot A4)"
        if: ${{ hashFiles('packages/integrations/test/r2-storage.test.ts') != '' }}
        run: |
          cd packages/integrations
          node --experimental-strip-types --no-warnings \
            --test test/r2-storage.test.ts

      - name: Gate summary
        run: |
          echo "CI gate (main buildable) — wave 0:"
          echo "  refs: SPEC.md wave 0 (main buildable), dependency-matrix S10/S15"
          echo "  wave 7 (ERYNIS) : E2E device + Focus DPC + perf + product modes"
          echo "  if a gate fails: git revert <commit> (1 story = 1 commit = 1 rollback)"
          echo "  see docs/ci/gate.md for the exact order + recovery."
