# Aurora — CI (surface réduite au socle après la purge du 2026-10-28).
#
# Quatre gates, dans cet ordre de coût croissant :
#   typecheck → lint → gardes d'architecture → tests
#
# Ce qui a été retiré : les suites E2E device (apps/mobile), le gate perf
# mobile, les tests de wiring des packages supprimés, les étapes Supabase/RLS
# (elles ne testaient pas d'application, seulement des fichiers SQL — à
# rebrancher le jour où le schéma est réécrit).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (--max-warnings 0)
        run: pnpm lint

      - name: Gardes d'architecture (G1-G3)
        run: sh scripts/check-boundaries.sh

      - name: Tests
        run: pnpm test
