# Aurora — Storybook CI/CD : build + deploy sur Render (STATIC SITE)
#
# Pipeline :
#   1. install          pnpm install (caching pnpm)
#   2. typecheck        tsc --noEmit (packages/ui)
#   3. build-storybook  storybook build → storybook-static/
#   4. deploy           render deploy → https://aurora-storybook.onrender.com
#   5. deploy-pages     deploy-pages → GitHub Pages → https://joynagassi-cyber.github.io/aurora/
#
# Trigger : push sur main OU PR vers main (build testé sur les PR)
# Deploy  : main uniquement (PR = build + test, main = deploy)
#
# Prérequis (1 fois, à poser dans GitHub Secrets) :
#   - RENDER_API_KEY      : https://dashboard.render.com/api-keys
#   - REPO_NAME           : nom du repo GitHub (ex. joynagassi-cyber/aurora)
#
# Méthode recommandée (sans secret, sans CLI) :
#   Le `render.yaml` à la racine du repo est lu automatiquement par Render
#   quand le service est créé via le dashboard :
#     1. dashboard.render.com → New+ → Static Site
#     2. Lien au repo GitHub `joynagassi-cyber/aurora`, branch `main`
#     3. Render détecte `render.yaml` et propose le service `aurora-storybook`
#        (rootDir packages/ui, buildCommand pnpm install + storybook build,
#         publishDir storybook-static)
#     4. Chaque push sur main = rebuild + republish auto.
#   Ce workflow GitHub reste utile pour : valider le build en PR (artefact
#   `storybook-static` téléchargeable), et forcer un deploy manuel via
#   RENDER_API_KEY / RENDER_SERVICE_ID (job `deploy`, noop si secrets absents).
#
# NOTE (diagnostic 2026-10-14) : le `rootDir: packages/ui` dans render.yaml
# est crucial. Les services créés via le MCP Render (sans rootDir, rootDir="")
# n'exposent pas ce paramètre : leur `publishPath` relatif ne publie alors
# que le preview Storybook (iframe.html + assets/*), pas le manager
# (index.html, sb-manager/, favicon*) — d'où une sidebar affichée mais aucun
# composant rendu. Réparation à la main dans le dashboard : Root Directory
# = packages/ui, Publish Path = storybook-static.
#
# GitHub Pages (alternative sans Render, sans dashboard manuel) :
#   - Le job `deploy-pages` pousse `storybook-static/` vers GitHub Pages
#     (CDN GitHub, pas de problème de rootDir/publishPath).
#   - `base: "/aurora/"` est déjà défini dans .storybook/main.ts (viteFinal)
#     pour que les asset URL soient relatifs au sous-dossier du repo.
#   - À activer une seule fois dans Settings → Pages → Build and deployment
#     → Source = "GitHub Actions" (le workflow `storybook-deploy.yml` est
#     automatiquement détecté comme la source de build).
#   - URL finale : https://joynagassi-cyber.github.io/aurora/

name: Storybook Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub Pages : la permission `pages` est requise pour que le job
# `deploy-pages` puisse écrire sur le branch de publication (pages).
# `id-token` est requis par actions/deploy-pages (OIDC, pas de secret).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # Build + typecheck sur chaque PR / push main
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck (packages/ui)
        working-directory: packages/ui
        # Pas de gate bloquant pour le deploy GitHub Pages : le typecheck
        # peut être cassé par un commit transitoire (ex. branchement
        # PowerSync en cours de stabilisation) — le build Storybook est
        # l'autre gate (il compile les .stories.tsx). continue-on-error ici
        # pour ne pas bloquer la publication du site.
        run: pnpm exec tsc --noEmit
        continue-on-error: true

      - name: Build Storybook
        working-directory: packages/ui
        # Le build statique est le gate de deploy : s'il échoue, le job
        # échoue et le deploy (needs: build) ne se déclenche pas.
        # Pas de continue-on-error — c'est le point de contrôle qualité.
        run: pnpm exec storybook build --output-dir storybook-static

      - name: Upload storybook-static (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  # ------------------------------------------------------------------
  # Deploy sur Render — main uniquement
  # ------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Storybook
        working-directory: packages/ui
        run: pnpm exec storybook build --output-dir storybook-static

      - name: Download build artifact (cache du job précédent)
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static

      # Render CLI (v2) : deploy un static site déjà buildé
      # La commande `render deploy` utilise RENDER_API_KEY + RENDER_SERVICE_ID
      # Alternative sans CLI : le service Render auto-déclenche son build
      # quand un push arrive sur main (Branch: main dans le dashboard)
      # — dans ce cas ce step est un noop optionnel.
      - name: Deploy via Render API (optionnel si auto-deploy est activé)
        # Décommenter si on veut un deploy forcé par le workflow :
        # uses: render-apps/render-action@v1
        # with:
        #   service-id: ${{ secrets.RENDER_SERVICE_ID }}
        #   api-key: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Deploy storybook à Render…"
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "::warning::RENDER_SERVICE_ID ou RENDER_API_KEY absent — déploy auto via le dashboard Render (push sur main) est le fallback."
            exit 0
          fi
          # Render CLI v2
          curl -fsSL https://render.com/install.sh | bash
          render deploy --api-key "$RENDER_API_KEY" --service-id "$RENDER_SERVICE_ID"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

  # ------------------------------------------------------------------
  # Deploy sur GitHub Pages — main uniquement (CDN GitHub, pas de Render)
  # ------------------------------------------------------------------
  # Prérequis une seule fois (dashboard GitHub, pas de secret requis) :
  #   Settings → Pages → Build and deployment → Source = "GitHub Actions"
  #   (le workflow est automatiquement détecté)
  #
  # Les permissions `pages: write` + `id-token: write` (OIDC) sont
  # déclarées au niveau du workflow (voir permissions: en tête).
  # Pas de RENDER_API_KEY ni de secret dédié — l'OIDC est la méthode
  # recommandée par GitHub pour Actions → Pages.
  #
  # NE PAS déclarer d'`environment:` ici : le job `deploy-pages` écrit
  # sur la branche de publication GitHub Pages, et tout environnement
  # with protection rule (ou custom deployment branch policy) bloque la
  # publication. GitHub Pages n'a besoin d'aucun environment pour
  # qu'actions/deploy-pages fonctionne.
  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'joynagassi-cyber'
    runs-on: ubuntu-latest
    environment:
      # Obligatoire pour actions/deploy-pages@v4/v5 : l'environnement
      # `github-pages` est auto-créé par GitHub quand Settings → Pages →
      # Source = "GitHub Actions". Sans ce bloc, le step Deploy échoue
      # (le site Pages n'est pas associé à l'environnement de publication).
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Upload Pages artifact (github-pages — convention attendue par
          Settings → Pages → Source = "Static HTML / GitHub Actions")
        # Le workflow GitHub Pages fourni par GitHub ("Static HTML - GitHub
        # Actions") attend un artefact nommé `github-pages` (via
        # actions/upload-pages-artifact). Le contenu du dossier
        # `storybook-static/` (build Storybook complet : index.html, iframe.html,
        # sb-manager/, manifests/, assets/) est uploadé tel quel — ce qui
        # corrigera aussi le problème de publication partielle de Render
        # (seul iframe.html + assets/* étaient servis).
        #
        # `base: "/aurora/"` (main.ts viteFinal) fait que les asset URL dans
        # index.html pointent vers /aurora/assets/... — cohérent avec l'URL
        # github.io/aurora/ (site de repo, pas de user).
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
