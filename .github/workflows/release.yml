# Aurora — Release pipeline (wave 7, ERYNIS task 8, W7-E1-2)
#
# Refs:
#   - docs/release/README S1/S2 (the process: tag v* -> build +
#     notes + changelog; deploy steps dry-run until OQ-03).
#   - docs/epics-stories.md W7-E1-2 (CI/CD: build, test, deploy;
#     release notes generated).
#   - AD-13 (1 story = 1 commit = 1 rollback; revert, not rewrite).
#
# The tag is the release trigger: pushing `v*` re-runs the ci-gate
# shape on the frozen tree, builds the WEB artifact, and cuts the GitHub
# Release from docs/release/changelog.md. Since the 2026-10-28 pivot
# the Phase-1 target is the WEB app (apps/web) — the Capacitor/APK line is
# no longer a release artifact (docs/analysis/voie-web-2026-10-28.md).
# Deploy steps to
# staging/prod are DRY-RUN (echo) until OQ-03 ratifies the env
# values (docs/release/README S5) — flip the `if` when the
# `SUPABASE_URL_PROD` / `CF_*` secrets land in the registry.

name: Release

on:
  push:
    tags:
      - 'v*'

# Concurrency : 1 release build par tag (un nouveau push sur la
# meme ref remplace l'ancien).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # 1. Gate on the tag — the ci-gate shape, re-run on the frozen tree
  # ------------------------------------------------------------------
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (--max-warnings 0)
        run: pnpm lint

      - name: Gardes d'architecture (G1-G3)
        run: sh scripts/check-boundaries.sh

      - name: Tests
        run: pnpm test

  # ------------------------------------------------------------------
  # 2. Build (web) + notes + release
  # ------------------------------------------------------------------
  release-build:
    runs-on: ubuntu-latest
    needs: [release-gate]
    permissions:
      contents: write # create the GitHub Release + upload the web bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build the web app (apps/web, pivot 2026-10-28)
        # AD-3 : seulement des valeurs PUBLISHABLE dans le bundle. Si l'un des
        # VITE_* manque, le build doit echouer ici plutot que livrer une coquille
        # qui ne se connecte a rien.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
        run: |
          set -euo pipefail
          pnpm -F @aurora/web build

      - name: Bundle budget (02 §9.1 — JS gzip <= 300 Ko)
        run: node scripts/check-web-bundle-budget.mjs --dist apps/web/dist

      - name: Upload the web bundle (release artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-web-${{ github.ref_name }}
          path: apps/web/dist
          retention-days: 30

      - name: Generate RELEASE_NOTES.md from the changelog
        # The `## Upcoming (v0.1.0)` section of docs/release/changelog.md
        # is the release-notes source (docs/release/README S2.2). The awk
        # block extracts `## Upcoming` .. the next `## ` top-level heading
        # (the `## Wave history` audit-trail section stops it) — the byte-
        # stable copy the GitHub Release is cut from.
        run: |
          set -euo pipefail
          OUT=RELEASE_NOTES.md
          awk '/^## Upcoming/{f=1} f && /^## / && !/^## Upcoming/{f=0} f{print}' \
            docs/release/changelog.md > "$OUT"
          echo "RELEASE_NOTES.md:"; cat "$OUT"
          [ -s "$OUT" ] || { echo "RELEASE_NOTES.md is empty — populate docs/release/changelog.md before cutting a tag (README S2.2)"; exit 1; }
        # NOTE: the empty-notes guard is a soft gate (the notes are the
        # human audit trail; the release-gate job above is the blocking
        # step). A tag cut on an empty Upcoming section is a process error,
        # not a CI failure.

      - name: Create GitHub Release + upload notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aurora ${{ github.ref_name }}"
          generate_release_notes: false
          files: |
            RELEASE_NOTES.md
          # L'artefact web (apps/web/dist) est attache au run via
          # actions/upload-artifact ci-dessus ; les notes restent le seul
          # fichier de la Release GitHub (le bundle se deploie, il ne se
          # distribue pas en piece jointe).

  # ------------------------------------------------------------------
  # 3. Deploy (staging -> prod) — DRY-RUN until OQ-03
  # ------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [release-build]
    # OQ-03 gate: the deploy steps are commented / dry-run until the
    # env values (regions, R2 bucket names, provider account IDs) are
    # ratified + the `SUPABASE_URL_PROD` / `CF_*` secrets land in the
    # registry (docs/release/README S3/S5). Flip this `if` when ready.
    if: false
    env:
      # Read from the GitHub Secrets registry (AD-3, never in the repo).
      SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET_PROD: ${{ secrets.R2_BUCKET_PROD }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      PS_ADMIN_TOKEN: ${{ secrets.PS_ADMIN_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # ----------------------------------------------------------------
      # Lot déploiement (plan 2026-10-14, Phase 7) : le deploy EF +
      # PowerSync + R2 (actuellement DRY-RUN — le job parent est
      # `if: false` tant que OQ-03 n'est pas ratifié).
      # ----------------------------------------------------------------
      - name: "Deploy Edge Functions (supabase functions deploy × 7)"
        # Les 7 EF (fn-agent-run, fn-canvas, fn-import-course,
        # fn-integrations, fn-job-dispatcher, fn-notifications,
        # fn-skills) — jamais fn-dev-auth (DEV-only, P6-6). Le
        # SUPABASE_ACCESS_TOKEN (le GitHub secret) auth le link.
        # Les secrets EF (SERVICE_ROLE_KEY, INTERNAL_FN_SECRET, les
        # provider keys) sont posés dans le dashboard Supabase (le
        # set-secrets.ps1) — le deploy ré-engage les EF avec les
        # secrets déjà provisionnés.
        run: |
          echo "EF deploy (DRY-RUN, OQ-03 gate):"
          echo "  supabase link ${SUPABASE_URL_DEV} (SUPABASE_ACCESS_TOKEN)"
          echo "  supabase functions deploy fn-agent-run fn-canvas"
          echo "    fn-import-course fn-integrations fn-job-dispatcher"
          echo "    fn-notifications fn-skills   # × 7, jamais fn-dev-auth"
          # Le réel (quand OQ-03 est ratifié) :
          #   supabase link ${SUPABASE_URL_DEV} --access-token ${SUPABASE_ACCESS_TOKEN}
          #   for fn in fn-agent-run fn-canvas fn-import-course fn-integrations \
          #             fn-job-dispatcher fn-notifications fn-skills; do
          #     supabase functions deploy "$fn"
          #   done

      - name: "Deploy PowerSync sync-config (powersync deploy, le SSoT des 11 streams)"
        # Le sync-config.yaml (11 streams, le SSoT du plan Phase 2) est
        # déployé via le CLI PowerSync (le PS_ADMIN_TOKEN = le secret
        # GitHub registry). Le relay.sql (le SSoT des 11 vues v_*_scope)
        # est appliqué en amont (la migration 0026, le back-fill
        # additif live, le plan Phase 1) — le deploy sync-config ne
        # touche QUE le stream config, pas le DB.
        run: |
          echo "PowerSync deploy (DRY-RUN, OQ-03 gate):"
          echo "  cd powersync && powersync login \$PS_ADMIN_TOKEN"
          echo "  powersync deploy sync-config   # les 11 streams -> le relay cloud"
          # Le réel (quand OQ-03 est ratifié + le relay est healthy
          # (Blocker n°1 résolu = le password Supabase re-posé dans
          # le dashboard PowerSync Cloud) :
          #   cd powersync
          #   powersync login "$PS_ADMIN_TOKEN"
          #   powersync deploy sync-config

      - name: "R2 artefact round-trip (scripts/r2-roundtrip.mjs, AD-16)"
        # La preuve que les artefacts atterrissent dans Cloudflare R2
        # (pas Supabase Storage) — le test du lot B Phase 4. Le
        # bucket R2_BUCKET_PROD (aurora-artifacts-prod, le SSoT
        # opérationnel du OQ-03 dérive) + le R2_S3_ENDPOINT + le
        # CF_API_TOKEN viennent du GitHub Secrets registry (AD-3).
        run: |
          echo "R2 round-trip (DRY-RUN, OQ-03 gate):"
          echo "  node scripts/r2-roundtrip.mjs   # PUT + GET + DELETE un artefact de test"
          # Le réel (quand OQ-03 est ratifié) :
          #   node scripts/r2-roundtrip.mjs

      - name: "Deploy staging (Supabase + CF Workers + R2, DRY-RUN)"
        run: |
          echo "STAGING (dry-run, OQ-03 not yet ratified):"
          echo "  supabase link ${SUPABASE_URL_DEV} + db push"
          echo "  wrangler deploy (CF Workers: jobs, last-resort fallback)"
          echo "  r2 sync (private buckets, presigned URL TTLs per 01 S4)"
          echo "  flip this step to the real deploy when OQ-03 is ratified"

      - name: "Deploy prod (DRY-RUN)"
        run: |
          echo "PROD (dry-run, OQ-03 not yet ratified):"
          echo "  supabase link ${SUPABASE_URL_DEV} (prod slot) + db push"
          echo "  wrangler deploy --env prod"
          echo "  flip when OQ-03 is ratified + the prod secrets land"
