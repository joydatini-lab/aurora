<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16161c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Aurora — design system et coquille web. Encre & Lumière."

    <title>Aurora · Design System</title>
    <!--
      Amorce visible : React la remplace au premier rendu. Si elle RESTE
      affichée, le module d'entrée n'a pas été évalué — l'écran blanc muet du
      2026-10-28 ne peut plus se reproduire sans le dire.
    -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #aurora-boot {
        display: grid;
        place-content: center;
        gap: 6px;
        height: 100%;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
        color: #4a4a55;
        text-align: center;
      }
      #aurora-boot strong {
        color: #16161c;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="aurora-boot">
        <strong>Aurora</strong>
        <span>Chargement du design system…</span>
      </div>
    </div>
    <noscript>Aurora nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
