<!DOCTYPE html><html class="h-full bg-white text-zinc-900 antialiased" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Focus — Chronomètre</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#2563EB',
              blue: '#2563EB',
              hover: '#1d4ed8'
            }
          },
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Fraunces, Inter, JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<!-- Custom Typography & Layout Adjustments -->
<style data-purpose="custom-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 20px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen bg-white font-sans text-zinc-900">
<!-- BEGIN: MainContainer -->
<div class="flex-1 flex flex-col max-w-md mx-auto w-full px-5 pt-8 pb-28">
<!-- BEGIN: Header -->
<header class="mb-4">
<h1 class="text-3xl font-bold font-serif tracking-tight text-zinc-950">Focus</h1>
</header>
<!-- END: Header -->
<!-- BEGIN: SegmentedControl -->
<div class="w-full bg-white p-1 rounded-2xl border border-zinc-200/90 shadow-sm flex items-center mb-10" data-purpose="mode-toggle" role="tablist" aria-label="Mode de concentration">
<!-- Unselected Tab: Pomodoro -->
<button class="flex-1 py-3 text-center text-sm font-semibold text-zinc-800 transition-colors rounded-xl" type="button" role="tab" aria-selected="false">
        Pomodoro
      </button>
<!-- Selected Tab: Chronomètre -->
<button class="flex-1 py-3 text-center text-sm font-semibold bg-[#2563EB] text-white rounded-xl shadow-sm transition-colors" type="button" role="tab" aria-selected="true">
        Chronomètre
      </button>
</div>
<!-- END: SegmentedControl -->
<!-- BEGIN: TimerDisplaySection -->
<section class="flex flex-col items-center justify-center my-auto py-2" data-purpose="stopwatch-display">
<!-- Large Stopwatch Digital Counter -->
<div class="font-mono text-[54px] sm:text-[58px] leading-none font-bold tracking-tight text-zinc-950 flex items-center justify-center select-all" aria-label="Temps écoulé : 42 minutes 18 secondes" role="timer">
<span class="">00</span>
<span class="mx-2 font-normal opacity-90">:</span>
<span class="">42</span>
<span class="mx-2 font-normal opacity-90">:</span>
<span class="">18</span>
</div>
<!-- Elapsed Time Subtitle -->
<p class="text-sm font-medium text-zinc-600 mt-5">Temps écoulé</p>
<!-- Current Focused Task -->
<h2 class="text-lg font-bold text-zinc-900 mt-2 text-center px-4 leading-snug">
        Lire les fiches techniques nationales
      </h2>
<!-- Triple Action Buttons -->
<div class="grid grid-cols-3 gap-3 w-full max-w-sm mt-8 px-2" data-purpose="timer-controls">
<!-- Tour Button -->
<button class="h-12 flex items-center justify-center rounded-2xl border-2 border-[#2563EB] text-[#2563EB] font-semibold text-base active:bg-blue-50 transition-colors min-h-[44px]" type="button">
          Tour
        </button>
<!-- Pause Button -->
<button class="h-12 flex items-center justify-center rounded-2xl border-2 border-[#2563EB] text-[#2563EB] font-semibold text-base active:bg-blue-50 transition-colors min-h-[44px]" type="button">
          Pause
        </button>
<!-- Terminer Button -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-[#2563EB] text-white font-semibold text-base shadow-sm active:bg-blue-700 transition-colors min-h-[44px]" type="button">
          Terminer
        </button>
</div>
</section>
<!-- END: TimerDisplaySection -->
<!-- BEGIN: LapsCard -->
<section class="mt-8 mb-4" data-purpose="laps-summary">
<div class="w-full rounded-2xl border border-zinc-200/90 bg-white p-5 shadow-sm">
<!-- Header -->
<div class="text-xs font-semibold tracking-wider text-zinc-600 uppercase mb-4">TOURS</div>
<!-- Laps List -->
<div class="divide-y divide-zinc-100">
<!-- Lap 2 -->
<div class="flex items-center justify-between pb-3.5 pt-0.5">
<span class="text-base text-zinc-800 font-normal">Tour 2</span>
<span class="text-base font-mono font-medium text-zinc-900">00:17:40</span>
</div>
<!-- Lap 1 -->
<div class="flex items-center justify-between pt-3.5 pb-0.5">
<span class="text-base text-zinc-800 font-normal">Tour 1</span>
<span class="text-base font-mono font-medium text-zinc-900">00:24:38</span>
</div>
</div>
</div>
</section>
<!-- END: LapsCard -->
</div>
<!-- END: MainContainer -->
<!-- BEGIN: BottomNavigationBar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200/80 px-6 pt-2 pb-5 z-50" data-purpose="mobile-tab-bar" aria-label="Navigation principale">
<div class="max-w-md mx-auto grid grid-cols-4 items-center">
<!-- Tab: Agent -->
<a class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-900 transition-colors min-h-[44px] min-w-[44px]" href="#agent" aria-label="Agent"><svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="text-[11px] font-medium leading-none">Agent</span></a>
<!-- Tab: Discovery -->
<a class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-900 transition-colors min-h-[44px] min-w-[44px]" href="#discovery" aria-label="Discovery"><svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg><span class="text-[11px] font-medium leading-none">Discovery</span></a>
<!-- Tab: Focus (Active) -->
<a class="flex flex-col items-center justify-center text-[#2563EB] min-h-[44px] min-w-[44px]" href="#focus" aria-label="Focus, page actuelle" aria-current="page"><div class="w-14 h-8 bg-blue-50/80 rounded-full flex items-center justify-center mb-0.5"><svg class="w-5 h-5 text-[#2563EB] stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" fill="currentColor" r="3"></circle></svg></div><span class="text-[11px] font-semibold leading-none text-[#2563EB]">Focus</span></a>
<!-- Tab: Plus -->
<a class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-900 transition-colors min-h-[44px] min-w-[44px]" href="#plus" aria-label="Plus"><svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg><span class="text-[11px] font-medium leading-none">Plus</span></a>
</div>
</nav>
<!-- END: BottomNavigationBar -->


</body></html>
