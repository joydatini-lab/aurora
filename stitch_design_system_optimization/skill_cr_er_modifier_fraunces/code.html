<!DOCTYPE html>

<html class="h-full bg-white" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Nouveau skill</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Fraunces & JetBrains Mono & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fraunces: ['Fraunces', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Safe areas for iOS mobile devices */
    .pb-safe {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans bg-white text-slate-900 antialiased select-none">
<!-- BEGIN: MainHeader -->
<header class="pt-safe px-4 pb-3 flex items-center gap-3 border-b border-transparent bg-white sticky top-0 z-20" data-purpose="top-navigation">
<button aria-label="Retour" class="p-1 -ml-1 text-blue-600 active:opacity-60 transition-opacity" type="button">
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-[26px] font-bold text-slate-900 tracking-tight font-fraunces">Nouveau skill</h1>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: FormContent -->
<main class="flex-1 overflow-y-auto px-5 pt-3 pb-28 space-y-6" data-purpose="skill-form">
<!-- Section: Skill Name -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-sm font-semibold text-slate-800" for="skill-name">
        Nom
      </label>
<input class="w-full h-13 px-4 py-3 bg-white text-[15px] font-medium text-slate-900 border border-slate-300 rounded-2xl focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition shadow-sm" id="skill-name" name="skill-name" type="text" value="TD béton armé"/>
<p class="text-xs text-slate-500 font-mono tracking-tight pt-0.5">
        Appel manuel : <span class="text-slate-600">/td-beton-arme</span>
</p>
</div>
<!-- Section: When to use -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-sm font-semibold text-slate-800" for="when-to-use">
        Quand l'utiliser
      </label>
<textarea class="w-full p-4 bg-white text-[15px] leading-relaxed text-slate-800 border border-slate-300 rounded-2xl focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none resize-none transition shadow-sm" id="when-to-use" name="when-to-use" rows="3">Quand je résous un exercice de dimensionnement en béton armé.</textarea>
<p class="text-xs text-slate-500 leading-normal pt-0.5">
        Sert à l'indexation : l'agent s'en sert pour choisir ce skill.
      </p>
</div>
<!-- Section: Instructions -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-sm font-semibold text-slate-800" for="instructions">
        Instructions
      </label>
<textarea class="w-full p-4 bg-white font-mono text-[13px] leading-relaxed text-slate-800 border border-slate-300 rounded-2xl focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none resize-none transition shadow-sm" id="instructions" name="instructions" rows="4">1. Rappelle les données et les hypothèses.
2. Pose les formules avant de calculer.
3. Vérifie les unités à chaque étape.</textarea>
</div>
<!-- Section: Authorized Tools -->
<div class="space-y-2.5" data-purpose="authorized-tools-section">
<h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
        OUTILS AUTORISÉS
      </h2>
<div class="bg-white border border-slate-300/90 rounded-2xl divide-y divide-slate-100 overflow-hidden shadow-sm">
<!-- Tool item: Recherche web -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50/50 transition">
<span class="text-[15px] font-medium text-slate-800">Recherche web</span>
<input class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer" name="tools" type="checkbox" value="web-search"/>
</label>
<!-- Tool item: Intégrations connectées -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50/50 transition">
<span class="text-[15px] font-medium text-slate-800">Intégrations connectées</span>
<input class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer" name="tools" type="checkbox" value="connected-integrations"/>
</label>
<!-- Tool item: Focus et Discovery -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50/50 transition">
<span class="text-[15px] font-medium text-slate-800">Focus et Discovery</span>
<input checked="" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer" name="tools" type="checkbox" value="focus-discovery"/>
</label>
</div>
</div>
<!-- Section: Activation toggle card -->
<div class="pt-0.5" data-purpose="activation-card">
<div class="bg-white border border-slate-300/90 rounded-2xl overflow-hidden shadow-sm">
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50/50 transition">
<span class="text-[15px] font-medium text-slate-800">
            Activer et indexer après l'enregistrement
          </span>
<input checked="" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer" name="activate_and_index" type="checkbox"/>
</label>
</div>
</div>
</main>
<!-- END: FormContent -->
<!-- BEGIN: BottomActionBar -->
<footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-100 p-4 pb-safe z-30" data-purpose="action-buttons">
<div class="flex items-center gap-3 max-w-lg mx-auto">
<!-- Cancel Button -->
<button class="w-1/3 py-3.5 px-4 text-[15px] font-medium text-blue-600 bg-white border border-blue-600 rounded-2xl active:bg-blue-50 active:scale-[0.98] transition shadow-sm text-center" type="button">
        Annuler
      </button>
<!-- Submit Button -->
<button class="w-2/3 py-3.5 px-4 text-[15px] font-medium text-white bg-blue-600 border border-blue-600 rounded-2xl active:bg-blue-700 active:scale-[0.98] transition shadow-sm text-center" type="submit">
        Enregistrer le skill
      </button>
</div>
</footer>
<!-- END: BottomActionBar -->
</body></html>
